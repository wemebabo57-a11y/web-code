<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;flex-direction:column;align-items:center;background:#1a1a1a;color:#fff;padding-top:20px}
#game{border:3px solid #444;background:#000}
.info{margin:10px 0;font-size:20px}
button{padding:8px 16px;font-size:16px;margin:0 5px;cursor:pointer;background:#28a745;border:none;color:#fff;border-radius:4px}
button:nth-child(2){background:#dc3545}
</style>
</head>
<body>
<div class="info">分数：<span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="info">
<button onclick="startGame()">开始AI自动游玩</button>
<button onclick="stopGame()">停止</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreDom=document.getElementById('score');
const size=20;
const count=canvas.width/size;
let snake,food,dx,dy,score,timer,run=false;
function init(){
snake=[{x:10,y:10}];
dx=1;dy=0;
score=0;
createFood();
scoreDom.textContent=score;
}
function createFood(){
let x,y;
do{
x=Math.floor(Math.random()*count);
y=Math.floor(Math.random()*count);
}while(snake.some(p=>p.x===x&&p.y===y))
food={x,y};
}
function draw(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#0f0';
snake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-2,size-2));
ctx.fillStyle='#f33';
ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
}
function aiAuto(){
const head=snake[0];
let targetX=food.x,targetY=food.y;
let dirs=[
{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
];
dirs.sort((a,b)=>{
const d1=Math.abs((head.x+a.x)-targetX)+Math.abs((head.y+a.y)-targetY);
const d2=Math.abs((head.x+b.x)-targetX)+Math.abs((head.y+b.y)-targetY);
return d1-d2;
});
for(let d of dirs){
let nx=head.x+d.x;
let ny=head.y+d.y;
if(nx<0||ny<0||nx>=count||ny>=count)continue;
if(snake.some(p=>p.x===nx&&p.y===ny))continue;
dx=d.x;dy=d.y;
break;
}
}
function update(){
aiAuto();
const head={x:snake[0].x+dx,y:snake[0].y+dy};
if(head.x<0||head.y<0||head.x>=count||head.y>=count){
stopGame();
return;
}
if(snake.some(p=>p.x===head.x&&p.y===head.y)){
stopGame();
return;
}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){
score+=10;
scoreDom.textContent=score;
createFood();
}else{
snake.pop();
}
draw();
}
function startGame(){
if(run)return;
init();
run=true;
draw();
timer=setInterval(update,80);
}
function stopGame(){
run=false;
clearInterval(timer);
}
</script>
</body>
</html>
